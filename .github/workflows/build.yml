name: SEO Engine Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate Pages
        run: node scripts/generate.js

      - name: Generate Sitemap
        run: node scripts/sitemap.js

      - name: Commit Changes
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add .
          git commit -m "auto generate seo pages" || echo "no changes"
          git push
